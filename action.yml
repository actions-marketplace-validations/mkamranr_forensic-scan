# The Marketplace requires this name to be globally unique across every action,
# GitHub username and organization. "Forensic Scan" slugifies to `forensic-scan`,
# which is an existing organization, so the listing carries the longer form. The
# repository, PyPI package and CLI command are all still `forensic-scan`.
name: 'Forensic Scan Action'
description: 'Detect obfuscation, hidden logic and smuggled payloads in pull requests'
author: 'forensic-scan contributors'

branding:
  icon: 'search'
  color: 'red'

inputs:
  path:
    description: 'Directory to scan.'
    required: false
    default: '.'
  diff:
    description: >-
      Git ref to scan against. Defaults to the pull request base, which is what
      makes this quiet enough to leave switched on. Set to an empty string to
      scan the whole repository.
    required: false
    default: ''
  fail-on:
    description: 'Severity at which to fail the check: CRITICAL, HIGH, MEDIUM, LOW or none.'
    required: false
    default: 'HIGH'
  upload-sarif:
    description: 'Upload results to the GitHub Security tab.'
    required: false
    default: 'true'
  version:
    description: 'Version of forensic-scan to install.'
    required: false
    default: 'latest'
  args:
    description: 'Extra arguments passed through to forensic-scan.'
    required: false
    default: ''

outputs:
  findings:
    description: 'Number of findings reported.'
    value: ${{ steps.run.outputs.findings }}
  risk-score:
    description: 'Aggregate risk score, 0-100.'
    value: ${{ steps.run.outputs.risk-score }}
  sarif-file:
    description: 'Path to the generated SARIF file.'
    value: ${{ steps.run.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install forensic-scan
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "latest" ]; then
          pip install --quiet forensic-scan
        else
          pip install --quiet "forensic-scan==${{ inputs.version }}"
        fi

    - name: Prefetch tree-sitter grammars
      shell: bash
      run: forensic-scan prefetch

    - name: Determine diff base
      id: base
      shell: bash
      run: |
        if [ -n "${{ inputs.diff }}" ]; then
          echo "ref=${{ inputs.diff }}" >> "$GITHUB_OUTPUT"
        elif [ -n "${{ github.base_ref }}" ]; then
          git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" || true
          echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
        else
          echo "ref=" >> "$GITHUB_OUTPUT"
        fi

    - name: Run forensic-scan
      id: run
      shell: bash
      run: |
        set +e
        DIFF_ARG=""
        if [ -n "${{ steps.base.outputs.ref }}" ]; then
          DIFF_ARG="--diff ${{ steps.base.outputs.ref }}"
        fi

        # SARIF for the Security tab, JSON for the outputs, Markdown for the
        # step summary. One scan each rather than parsing one format into three.
        forensic-scan "${{ inputs.path }}" $DIFF_ARG \
          --format sarif --output forensic-scan.sarif \
          --fail-on none --quiet ${{ inputs.args }}

        forensic-scan "${{ inputs.path }}" $DIFF_ARG \
          --format json --output forensic-scan.json \
          --fail-on none --quiet ${{ inputs.args }}

        forensic-scan "${{ inputs.path }}" $DIFF_ARG \
          --format markdown --output forensic-scan.md \
          --fail-on "${{ inputs.fail-on }}" --quiet ${{ inputs.args }}
        STATUS=$?

        FINDINGS=$(python -c "import json;print(json.load(open('forensic-scan.json'))['summary']['findings'])")
        SCORE=$(python -c "import json;print(json.load(open('forensic-scan.json'))['summary']['risk_score'])")
        echo "findings=$FINDINGS" >> "$GITHUB_OUTPUT"
        echo "risk-score=$SCORE" >> "$GITHUB_OUTPUT"
        echo "sarif-file=forensic-scan.sarif" >> "$GITHUB_OUTPUT"

        cat forensic-scan.md >> "$GITHUB_STEP_SUMMARY"
        exit $STATUS

    # Code scanning is unavailable on private repositories without GitHub
    # Advanced Security. The scan's own exit status is the gate, so a failed
    # upload must not turn a passing check red.
    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true'
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: forensic-scan.sarif
        category: forensic-scan
