name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Prefetch tree-sitter grammars
        run: uv run forensic-scan prefetch
      - name: Unit and integration tests
        run: uv run pytest tests/unit tests/integration -q

  quality:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy

  benchmark:
    name: detection and false-positive gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - name: Prefetch tree-sitter grammars
        run: uv run forensic-scan prefetch
      - name: Corpus benchmark
        run: uv run pytest tests/benchmark -q
      - name: Publish the measured rates
        run: uv run python scripts/benchmark_report.py >> "$GITHUB_STEP_SUMMARY"

  self-scan:
    name: scan this repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Prefetch tree-sitter grammars
        run: uv run forensic-scan prefetch
      - name: Scan the scanner
        run: |
          uv run forensic-scan src \
            --format sarif --output forensic.sarif --fail-on HIGH
      # Uploading to the Security tab needs code scanning, which private repos
      # only get with GitHub Advanced Security. The scan above is the gate; the
      # upload is a convenience, so its absence must not fail the build.
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: forensic.sarif
          category: forensic-scan
