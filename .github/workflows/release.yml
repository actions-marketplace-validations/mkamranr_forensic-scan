name: Release

on:
  release:
    types: [published]
  # Manual re-run, for when a publish needs repeating without cutting a new
  # release -- the first time PyPI credentials are wired up, for instance.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  pypi:
    name: publish to PyPI
    runs-on: ubuntu-latest
    # Requires a PyPI trusted publisher, which has to be registered by hand at
    # https://pypi.org/manage/account/publishing/ before it can work. Until that
    # is done this job skips rather than failing the release. Enable with:
    #   gh variable set PYPI_PUBLISH --body true
    if: vars.PYPI_PUBLISH == 'true'
    environment: release
    permissions:
      id-token: write  # trusted publishing; no long-lived token exists to leak
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Check the distribution
        run: uvx twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: publish container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
