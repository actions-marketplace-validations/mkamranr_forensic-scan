[project]
name = "forensic-scan"
version = "0.1.1"
description = "Forensic AST scanner for hidden logic, obfuscation and smuggled payloads in source repositories"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["security", "static-analysis", "supply-chain", "obfuscation", "ast", "sast"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.9",
    "pathspec>=0.12",
]

[project.urls]
Homepage = "https://github.com/mkamranr/forensic-scan"
Repository = "https://github.com/mkamranr/forensic-scan"
Issues = "https://github.com/mkamranr/forensic-scan/issues"

[project.scripts]
forensic-scan = "forensic_scan.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forensic_scan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# Table-driven test data reads worse wrapped than slightly over the limit.
"tests/**" = ["E501"]
# Typer declares options as call-expression defaults; that is its documented API.
"src/forensic_scan/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
packages = ["forensic_scan"]
mypy_path = "src"
strict = true
warn_return_any = true
